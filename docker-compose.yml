version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trafficvision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trafficvision
      POSTGRES_PASSWORD: trafficvision
      POSTGRES_DB: trafficvision_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafficvision"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
